<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terima Kasih - SITAMU BPS Lebak</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Bagian Header (Navbar) */
        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 40px; background: #ffffff; z-index: 10;
        }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .app-icon {
            background-color: #F37021; color: white; width: 36px; height: 36px;
            border-radius: 8px; display: flex; justify-content: center; align-items: center; font-size: 18px; font-weight: bold;
        }
        .app-title-container { display: flex; flex-direction: column; }
        .app-title { font-weight: 800; color: #333; font-size: 16px; line-height: 1; letter-spacing: 0.5px; }
        .app-subtitle { font-size: 9px; color: #F37021; font-weight: 600; letter-spacing: 1px; margin-top: 3px; }
        
        .header-right {
            background-color: #FFF9F5; border: 1px solid #FDE4D0; padding: 8px 16px;
            border-radius: 30px; font-size: 12px; font-weight: 600; color: #666;
            display: flex; align-items: center; gap: 8px;
        }
        .dot { width: 8px; height: 8px; background-color: #00D26A; border-radius: 50%; }

        /* Konten Utama: Latar Belakang Penuh */
        .main-content {
            flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: linear-gradient(135deg, #FFF5EC 0%, #FFE3CC 100%);
            padding: 60px 20px; text-align: center;
        }

        /* Ikon Sukses */
        .success-icon-wrapper {
            width: 90px; height: 90px; background-color: white;
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            box-shadow: 0 10px 30px rgba(243, 112, 33, 0.15); margin-bottom: 20px;
        }
        .success-icon { color: #F37021; font-size: 45px; font-weight: bold; }

        /* Teks & Lencana */
        .badge-success {
            background-color: white; color: #F37021; padding: 6px 16px;
            border-radius: 20px; font-size: 11px; font-weight: 700;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 20px; display: inline-flex; align-items: center; gap: 5px;
        }
        h1 { color: #222; font-size: 32px; font-weight: 800; margin: 0 0 15px 0; }
        p.subtitle { color: #666; font-size: 15px; line-height: 1.6; margin: 0; max-width: 450px; font-weight: 500; }

        /* Footer */
        .footer { background: #ffffff; text-align: center; padding: 25px 20px; font-size: 10px; color: #AAA; line-height: 1.8; }

        /* Responsif HP */
        @media (max-width: 600px) {
            .header { padding: 15px 20px; }
            .header-right { display: none; }
            h1 { font-size: 26px; }
            .success-icon-wrapper { width: 70px; height: 70px; }
            .success-icon { font-size: 35px; }
        }
    </style>
</head>
<body>

    <!-- Header / Navbar -->
    <div class="header">
        <div class="header-left">
            <div class="app-icon">📖</div>
            <div class="app-title-container">
                <span class="app-title">SITAMU</span>
                <span class="app-subtitle">SISTEM INFORMASI BUKU TAMU</span>
            </div>
        </div>
        <div class="header-right">
            <span class="dot"></span>
            <span id="liveClock">00:00 WIB</span>
        </div>
    </div>

    <!-- Konten Utama: Banner Oranye -->
    <div class="main-content">
        <div class="success-icon-wrapper">
            <div class="success-icon">&#10003;</div>
        </div>
        
        <div class="badge-success">✨ Berhasil Terkirim</div>
        
        <h1>Terima Kasih!</h1>
        <p class="subtitle">Terima kasih sudah mengisi form. Silakan menunggu di area lobi.</p>
    </div>

    <!-- Footer -->
    <div class="footer">
        kunjungi website lebakkab.bps.go.id<br>
        Jl. Jendral Sudirman No.Km 3, Narimbang Mulia, Kec. Rangkasbitung, Kabupaten Lebak, Banten
    </div>

    <!-- Script Jam Digital & Auto Redirect -->
    <script>
        // Jam Digital
        function updateClock() {
            const now = new Date();
            let hours = now.getHours().toString().padStart(2, '0');
            let minutes = now.getMinutes().toString().padStart(2, '0');
            const clockEl = document.getElementById('liveClock');
            if(clockEl) clockEl.textContent = hours + ':' + minutes + ' WIB';
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Redirect otomatis ke halaman awal setelah 5 detik
        setTimeout(function() {
            window.location.href = "/";
        }, 5000);
    </script>
</body>
</html>
