<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isi Buku Tamu - SITAMU BPS Lebak</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Montserrat', sans-serif; margin: 0; padding: 0;
            background-color: #ffffff; min-height: 100vh;
            display: flex; flex-direction: column; overflow-x: hidden; position: relative; z-index: 0;
        }

        /* Latar Belakang Pendaran (Blobs) */
        .blob-left {
            position: absolute; left: -10%; top: 10%; width: 400px; height: 400px;
            background: rgba(243, 112, 33, 0.12); filter: blur(100px); border-radius: 50%; z-index: -1;
        }
        .blob-right {
            position: absolute; right: -5%; bottom: 10%; width: 500px; height: 500px;
            background: rgba(243, 112, 33, 0.12); filter: blur(120px); border-radius: 50%; z-index: -1;
        }

        /* Bagian Header (Navbar) */
        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 40px; background: rgba(255, 255, 255, 0.9); border-bottom: 1px solid #f0f0f0; z-index: 10;
        }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .app-icon {
            background-color: #F37021; color: white; width: 36px; height: 36px;
            border-radius: 8px; display: flex; justify-content: center; align-items: center; font-size: 18px; font-weight: bold;
        }
        .app-title-container { display: flex; flex-direction: column; }
        .app-title { font-weight: 800; color: #333; font-size: 16px; line-height: 1; letter-spacing: 0.5px; }
        .app-subtitle { font-size: 9px; color: #F37021; font-weight: 600; letter-spacing: 1px; margin-top: 3px; }
        
        .header-right-container { display: flex; gap: 15px; align-items: center; }
        .btn-kembali {
            background-color: #F8F9FA; color: #555; text-decoration: none; padding: 8px 16px;
            border-radius: 30px; font-size: 12px; font-weight: 600; border: 1px solid #E9ECEF;
            transition: 0.2s; display: flex; align-items: center; gap: 5px;
        }
        .btn-kembali:hover { background-color: #E2E3E5; }
        .header-right {
            background-color: #FFF9F5; border: 1px solid #FDE4D0; padding: 8px 16px;
            border-radius: 30px; font-size: 12px; font-weight: 600; color: #666;
            display: flex; align-items: center; gap: 8px;
        }
        .dot { width: 8px; height: 8px; background-color: #00D26A; border-radius: 50%; }

        /* Konten Utama */
        .main-content {
            flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center;
            padding: 30px 20px; z-index: 10;
        }
        .form-card {
            background: white; padding: 40px; border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.04); border: 1px solid #F5F5F5;
            width: 100%; max-width: 650px;
        }

        /* Header Card */
        .card-header-center { text-align: center; margin-bottom: 30px; }
        h1 { color: #222; font-size: 26px; font-weight: 800; margin: 0; }

        /* Grid Formulir 2 Kolom */
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px; }
        .form-group.full-width { grid-column: span 2; }
        
        label { display: block; font-size: 12px; font-weight: 700; color: #444; margin-bottom: 8px; }
        .required { color: #DC3545; }
        
        .form-control {
            width: 100%; padding: 14px; background-color: #F8F9FA;
            border: 1px solid #E9ECEF; border-radius: 10px; font-family: 'Montserrat', sans-serif;
            font-size: 13px; box-sizing: border-box; transition: 0.3s; color: #333;
        }
        .form-control::placeholder { color: #ADB5BD; font-weight: 500; }
        .form-control:focus { border-color: #F37021; background-color: white; outline: none; box-shadow: 0 0 0 3px rgba(243, 112, 33, 0.1); }

        /* Tombol Submit */
        .btn-submit {
            width: 100%; background-color: #F37021; color: white; border: none; padding: 16px;
            font-size: 15px; font-weight: 700; border-radius: 10px; cursor: pointer;
            box-shadow: 0 8px 20px rgba(243, 112, 33, 0.3); transition: 0.3s; font-family: inherit;
        }
        .btn-submit:hover { background-color: #D95E16; transform: translateY(-2px); }
        .btn-cancel {
            display: block; text-align: center; margin-top: 20px; color: #888;
            font-size: 12px; font-weight: 600; text-decoration: none;
        }
        .btn-cancel:hover { color: #333; }

        /* Footer */
        .footer { text-align: center; padding: 20px; font-size: 10px; color: #AAA; line-height: 1.8; z-index: 10; }

        /* Responsif HP */
        @media (max-width: 600px) {
            .form-grid { grid-template-columns: 1fr; gap: 15px; }
            .form-group.full-width { grid-column: span 1; }
            .header { padding: 15px 20px; }
            .header-right { display: none; }
            .form-card { padding: 25px; }
        }
    </style>
</head>
<body>
    <!-- Pendaran Latar -->
    <div class="blob-left"></div>
    <div class="blob-right"></div>

    <!-- Header / Navbar -->
    <div class="header">
        <div class="header-left">
            <div class="app-icon">📖</div>
            <div class="app-title-container">
                <span class="app-title">SITAMU</span>
                <span class="app-subtitle">SISTEM INFORMASI BUKU TAMU</span>
            </div>
        </div>
        <div class="header-right-container">
            <a href="/" class="btn-kembali">&larr; Kembali</a>
            <div class="header-right">
                <span class="dot"></span>
                <span id="liveClock">00:00 WIB</span>
            </div>
        </div>
    </div>

    <!-- Konten Utama: Form Card -->
    <div class="main-content">
        <div class="form-card">
            <div class="card-header-center">
                <h1>Mohon Isi Biodata Anda</h1>
            </div>

            <form id="tamuForm" method="POST" action="/isi-form" novalidate>
                <!-- GRID 2 KOLOM -->
                <div class="form-grid">
                    <!-- Baris 1: Nama & No HP -->
                    <div class="form-group">
                        <label>Nama Lengkap <span class="required">*</span></label>
                        <!-- Huruf a-z, spasi, tanda hubung (-), dan petik (') -->
                        <input type="text" name="nama_lengkap" id="nama_lengkap" class="form-control" placeholder="cth. Budi Santoso" autocomplete="off" oninput="sanitizeTeksDasar(this)" required>
                    </div>
                    <div class="form-group">
                        <label>No. Handphone (WhatsApp) <span class="required">*</span></label>
                        <!-- Hanya angka saja -->
                        <input type="tel" name="no_hp" id="no_hp" class="form-control" placeholder="cth. 081234567890" autocomplete="off" oninput="sanitizeAngka(this)" required>
                    </div>

                    <!-- Baris 2: Instansi & Jabatan -->
                    <div class="form-group">
                        <label>Asal Instansi / Perusahaan <span class="required">*</span></label>
                        <!-- Huruf a-z, spasi, tanda hubung (-), dan petik (') -->
                        <input type="text" name="instansi" id="instansi" class="form-control" placeholder="cth. Universitas Terbuka" autocomplete="off" oninput="sanitizeTeksDasar(this)" required>
                    </div>
                    <div class="form-group">
                        <label>Jabatan / Posisi</label>
                        <!-- Huruf a-z, spasi, tanda hubung (-), dan petik (') -->
                        <input type="text" name="jabatan" id="jabatan" class="form-control" placeholder="cth. Mahasiswa" autocomplete="off" oninput="sanitizeTeksDasar(this)">
                    </div>

                    <!-- Baris 3: Bertemu & Tujuan -->
                    <div class="form-group">
                        <label>Mau Bertemu Siapa? <span class="required">*</span></label>
                        <!-- Huruf a-z, spasi, tanda hubung (-), dan petik (') -->
                        <input type="text" name="bertemu_siapa" id="bertemu_siapa" class="form-control" placeholder="cth. Ibu Ratna" autocomplete="off" oninput="sanitizeTeksDasar(this)" required>
                    </div>
                    <div class="form-group">
                        <label>Tujuan Kunjungan <span class="required">*</span></label>
                        <!-- Huruf a-z, spasi, tanda hubung (-), dan petik (') -->
                        <input type="text" name="tujuan_kunjungan" id="tujuan_kunjungan" class="form-control" placeholder="cth. Keperluan Wawancara" autocomplete="off" oninput="sanitizeTeksDasar(this)" required>
                    </div>

                    <!-- Baris 4: Alamat -->
                    <div class="form-group full-width">
                        <label>Alamat Domisili / Kantor</label>
                        <!-- Huruf a-z, spasi, tanda hubung (-), petik ('), titik (.), dan koma (,) -->
                        <input type="text" name="alamat" id="alamat" class="form-control" placeholder="cth. Rangkasbitung" autocomplete="off" oninput="sanitizeAlamat(this)">
                    </div>
                </div>

                <!-- Tombol Konfirmasi & Batal -->
                <button type="submit" id="btnSubmit" class="btn-submit">Konfirmasi</button>
                <a href="/" class="btn-cancel">Batal</a>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <div class="footer">
        kunjungi website lebakkab.bps.go.id<br>
        Jl. Jendral Sudirman No.Km 3, Narimbang Mulia, Kec. Rangkasbitung, Kabupaten Lebak, Banten
    </div>

    <!-- Script Jam Digital & Validasi Form -->
    <script>
        function sanitizeTeksDasar(el) {
            el.value = el.value.replace(/[^A-Za-z\s\-']/g, '');
        }

        function sanitizeAngka(el) {
            el.value = el.value.replace(/[^0-9]/g, '');
        }

        function sanitizeAlamat(el) {
            el.value = el.value.replace(/[^A-Za-z\s\-'\.,]/g, '');
        }

        function updateClock() {
            const now = new Date();
            let hours = now.getHours().toString().padStart(2, '0');
            let minutes = now.getMinutes().toString().padStart(2, '0');
            const clockEl = document.getElementById('liveClock');
            if(clockEl) clockEl.textContent = hours + ':' + minutes + ' WIB';
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Validasi tombol submit agar tidak bisa lanjut jika kolom wajib (*) kosong
        document.getElementById('tamuForm').addEventListener('submit', function(event) {
            const nama = document.getElementById('nama_lengkap').value.trim();
            const hp = document.getElementById('no_hp').value.trim();
            const instansi = document.getElementById('instansi').value.trim();
            const bertemu = document.getElementById('bertemu_siapa').value.trim();
            const tujuan = document.getElementById('tujuan_kunjungan').value.trim();

            if (!nama || !hp || !instansi || !bertemu || !tujuan) {
                event.preventDefault();
                alert('⚠️ Mohon lengkapi semua kolom bertanda bintang (*) terlebih dahulu!');
                return false;
            }

            var btn = document.getElementById('btnSubmit');
            btn.innerHTML = '⏳ Sedang memproses...';
            btn.style.backgroundColor = '#ccc';
            btn.style.boxShadow = 'none';
        });
    </script>
</body>
</html>
