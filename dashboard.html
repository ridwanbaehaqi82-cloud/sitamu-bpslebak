<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - SITAMU BPS Lebak</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #F37021;
            --primary-light: #FFF5F0;
            --bg-color: #F8F9FB;
            --text-dark: #2D3748;
            --text-muted: #718096;
            --border-color: #EDF2F7;
        }

        body { font-family: 'Montserrat', sans-serif; margin: 0; background-color: var(--bg-color); display: flex; color: var(--text-dark); }
        
        /* SIDEBAR & LOGO BPS */
        .sidebar { width: 260px; background: white; height: 100vh; position: fixed; border-right: 1px solid var(--border-color); display: flex; flex-direction: column; padding-bottom: 20px;}
        .sidebar-header { padding: 25px 20px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; gap: 12px; }
        .sidebar-header img { width: 42px; height: auto; }
        .brand-text { display: flex; flex-direction: column; text-align: left; }
        .brand-text span { font-size: 11px; font-weight: 800; color: #000000; line-height: 1.3; }
        
        .nav-title { font-size: 10px; color: #A0AEC0; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; padding: 25px 20px 10px; margin: 0; }
        .nav-links { list-style: none; padding: 0 15px; margin: 0; flex: 1; }
        .nav-links li { margin-bottom: 5px; }
        .nav-links a { display: flex; align-items: center; gap: 12px; padding: 12px 15px; border-radius: 10px; color: var(--text-muted); text-decoration: none; font-weight: 600; font-size: 13px; transition: 0.2s; }
        .nav-links a.active { background: var(--primary-light); color: var(--primary); }
        .nav-links a:hover:not(.active) { background: #F7FAFC; color: var(--text-dark); }
        
        .sidebar-footer { padding: 0 15px; }
        .sidebar-footer a { display: flex; align-items: center; gap: 10px; color: #A0AEC0; text-decoration: none; font-size: 13px; font-weight: 600; padding: 12px 15px; transition: 0.2s; }
        .sidebar-footer a:hover { color: #E53E3E; }

        /* MAIN CONTENT */
        .main-content { margin-left: 260px; flex: 1; padding: 30px 40px; box-sizing: border-box; }
        
        /* HEADER */
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
        .header-left h1 { margin: 0 0 5px 0; font-size: 22px; font-weight: 700; color: var(--text-dark); }
        .header-left p { margin: 0; font-size: 13px; color: var(--text-muted); }
        
        .header-right { display: flex; align-items: center; gap: 20px; }
        .badge-system { background: #E6F7ED; color: #00B050; padding: 8px 15px; border-radius: 20px; font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
        .badge-system::before { content: ''; display: inline-block; width: 8px; height: 8px; background: #00B050; border-radius: 50%; }
        
        .profile-card { display: flex; align-items: center; gap: 12px; }
        .profile-avatar { width: 35px; height: 35px; background: #FFF5F0; color: var(--primary); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: 700; font-size: 12px; border: 1px solid #FDE4D0; }
        .profile-info { display: flex; flex-direction: column; }
        .profile-name { font-size: 13px; font-weight: 700; color: var(--text-dark); }
        .profile-role { font-size: 11px; color: var(--text-muted); }

        /* WELCOME CARD */
        .welcome-card { background: white; padding: 50px; border-radius: 16px; box-shadow: 0 2px 20px rgba(0,0,0,0.02); text-align: center; border: 1px solid var(--border-color); }
        .welcome-card h2 { font-size: 28px; font-weight: 800; color: var(--text-dark); margin-bottom: 10px; }
        .welcome-card p { font-size: 15px; color: var(--text-muted); margin: 0; }
    </style>
</head>
<body>

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <img src="{{ url_for('static', filename='img/logobpslebak.png') }}" alt="Logo BPS">
            <div class="brand-text">
                <span>Badan Pusat Statistik</span>
                <span>Kabupaten Lebak</span>
            </div>
        </div>

        <p class="nav-title">Menu Utama</p>
        <ul class="nav-links">
            <li><a href="{{ url_for('dashboard') }}" class="active"><span>📊</span> Dashboard</a></li>
            <li><a href="{{ url_for('buku_tamu') }}"><span>📋</span> Buku Tamu</a></li>
            <li><a href="{{ url_for('laporan') }}"><span>📈</span> Laporan</a></li>
        </ul>
        <div class="sidebar-footer">
            <a href="{{ url_for('logout') }}"><span>🚪</span> Logout</a>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
        <!-- HEADER -->
        <header class="header-top">
            <div class="header-left">
                <h1>Dashboard</h1>
                <p>Halaman Utama Administrator</p>
            </div>
            <div class="header-right">
                <div class="profile-card">
                    <div class="profile-avatar">AD</div>
                    <div class="profile-info">
                        <span class="profile-name">Administrator</span>
                        <span class="profile-role">Front Desk Station</span>
                    </div>
                </div>
            </div>
        </header>

        <!-- WELCOME SECTION -->
        <div class="welcome-card">
            <h2>Halo, Admin</h2>
            <p>Selamat datang di SITAMU (Sistem Informasi Buku Tamu) BPS Kabupaten Lebak.</p>
        </div>
    </main>

</body>
</html>
